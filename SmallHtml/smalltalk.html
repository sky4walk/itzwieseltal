<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smalltalk-Werkbank</title>
<meta name="description" content="Smalltalk-80 im Browser: Workspace, System Browser, Inspector, Debugger und SUnit – Begleitseite zum Smalltalk-Artikel auf itzwieseltal.wordpress.com">
<style>
:root{
  --ink:#111;--paper:#fff;--paper2:#f4f3ef;--line:#111;--mut:#666;--sel:#1d1d1d;--selink:#fff;
  --accent:#2a4bd7;--pc:#ffe27a;--err:#c62828;--ok:#2e7d32;--warn:#b26a00;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fs:13px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 var(--sans);color:var(--ink);background:#bdbdbd;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--paper);border-bottom:2px solid var(--line);flex-wrap:wrap}
header h1{font:700 16px/1 var(--mono);margin:0;letter-spacing:.02em;white-space:nowrap}
header h1 span{font-weight:400;color:var(--mut)}
header .home{margin-left:auto;font-size:12px;white-space:nowrap}
#menu{display:flex;gap:2px;flex-wrap:wrap;align-items:center;padding:4px 8px;background:var(--paper2);border-bottom:1px solid var(--line)}
.mb{font:12px var(--sans);background:transparent;border:1px solid transparent;padding:3px 8px;cursor:pointer;color:var(--ink);border-radius:2px}
.mb:hover,.mb:focus-visible{border-color:var(--line);background:var(--paper)}
.mb.stop{color:var(--err);display:none}
body.running .mb.stop{display:inline-block;border-color:var(--err)}
#status{font:12px var(--mono);color:var(--mut);padding:0 6px;min-height:1em}
#desk{position:relative;flex:1;overflow:hidden;
  background-color:#9a9a9a;
  background-image:radial-gradient(#7d7d7d 1px,transparent 1.2px),radial-gradient(#b5b5b5 1px,transparent 1.2px);
  background-size:4px 4px;background-position:0 0,2px 2px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.92em;background:var(--paper2);padding:0 3px}
.mut{color:var(--mut)}

/* Fenster */
.win{position:absolute;display:flex;flex-direction:column;background:var(--paper);border:1.5px solid var(--line);
  box-shadow:3px 3px 0 rgba(0,0,0,.55);resize:both;overflow:hidden;min-width:260px;min-height:140px}
.wbar{display:flex;align-items:center;gap:4px;height:24px;padding:0 4px 0 0;border-bottom:1.5px solid var(--line);cursor:move;user-select:none;touch-action:none;
  background:var(--paper)}
.win.active .wbar{background:repeating-linear-gradient(180deg,var(--paper) 0 2px,var(--ink) 2px 3px);background-clip:content-box;padding-top:4px;padding-bottom:4px;height:24px}
.wt{font:700 12px/16px var(--mono);background:var(--paper);padding:0 8px;border-right:1.5px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
.win.active .wt{border:1.5px solid var(--line);border-left:0}
.wfill{flex:1}
.wx{font:700 14px/1 var(--mono);width:20px;height:16px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;padding:0;color:var(--ink)}
.wx:hover{background:var(--ink);color:var(--paper)}
.wbody{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.win.busy{opacity:.85}

/* Knöpfe */
.tools{display:flex;gap:4px;flex-wrap:wrap;padding:4px;border-bottom:1px solid var(--line);background:var(--paper2)}
.b,.bs,.seg{font:12px var(--sans);border:1px solid var(--line);background:var(--paper);padding:2px 8px;cursor:pointer;color:var(--ink);border-radius:2px}
.bs{padding:1px 6px;font-size:11px}
.b:hover,.bs:hover,.seg:hover{background:var(--ink);color:var(--paper)}
.b:disabled,.bs:disabled{opacity:.4;pointer-events:none}
.b.prim{font-weight:600}
.b.dirty{background:var(--pc)}
.b.danger{border-color:var(--err);color:var(--err)}
.b.warn{border-color:var(--warn);color:var(--warn)}
.side{display:flex;border-top:1px solid var(--line)}
.seg{flex:1;border:0;border-right:1px solid var(--line);border-radius:0}
.seg:last-child{border-right:0}
.seg.on{background:var(--ink);color:var(--paper)}
button:focus-visible,.list:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* Listen */
.list{overflow:auto;font:12px/1.5 var(--mono);background:var(--paper);min-height:0}
.lh{position:sticky;top:0;background:var(--paper2);border-bottom:1px solid var(--line);padding:1px 6px;font:600 11px var(--sans);color:var(--mut)}
.li{padding:0 6px;white-space:nowrap;cursor:default;overflow:hidden;text-overflow:ellipsis}
.li:hover{background:var(--paper2)}
.li.sel{background:var(--sel);color:var(--selink)}
.li.kern{color:#555}.li.sel.kern{color:#ddd}
.li.doit{font-style:italic}
.li.iv{color:#2a4bd7}.li.sel.iv{color:#cfd8ff}
.li.r-pass{color:var(--ok)}.li.r-failure{color:var(--warn)}.li.r-error{color:var(--err)}
.li.sel.r-pass,.li.sel.r-failure,.li.sel.r-error{color:var(--selink)}

/* Code */
.code{position:relative;flex:1;min-height:60px;background:var(--paper)}
.code pre,.code textarea{position:absolute;inset:0;margin:0;padding:8px 10px;border:0;font:var(--fs)/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:break-word;tab-size:4;-moz-tab-size:4;overflow-y:scroll;overflow-x:hidden;letter-spacing:0}
.code pre{pointer-events:none;color:var(--ink);scrollbar-width:auto}
.code textarea{background:transparent;color:transparent;caret-color:var(--ink);resize:none;outline:none;width:100%;height:100%}
.code textarea::selection{background:rgba(42,75,215,.28);color:transparent}
.code textarea[readonly]{caret-color:transparent}
.code i{font-style:normal}
.tc{color:#2e7d32;font-style:italic!important}.ts{color:#9c2b6a}.ty{color:#7b4a00}.tn{color:#1d5fa8}.tk{color:#111;font-weight:600}
.tr{color:#6a1b9a;font-weight:600}.tg{color:#00695c}.to{color:var(--err);font-weight:700}
mark{background:var(--pc);color:inherit;outline:1px solid #c9a400}
mark.err{background:#ffcdd2;outline-color:var(--err)}
.errtip{position:absolute;right:16px;bottom:8px;max-width:80%;background:var(--err);color:#fff;font:12px var(--sans);padding:4px 8px;border:1px solid var(--line);z-index:2}

/* Browser */
.bpanes{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;height:38%;min-height:110px;border-bottom:1px solid var(--line)}
.bpanes>*{border-right:1px solid var(--line)}
.bpanes>*:last-child{border-right:0}
.bcol{display:flex;flex-direction:column;min-height:0}
.bcol .list{flex:1}
.binfo{font:11px var(--mono);color:var(--mut);padding:2px 8px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--paper2)}

/* Inspector */
.ihead{padding:4px 8px;border-bottom:1px solid var(--line);font:12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--paper2)}
.isplit{display:grid;grid-template-columns:38% 1fr;flex:1;min-height:80px;border-bottom:1px solid var(--line)}
.isplit .list{border-right:1px solid var(--line)}
.ival{margin:0;padding:6px 8px;font:12px/1.5 var(--mono);white-space:pre-wrap;overflow:auto;overflow-wrap:anywhere;background:var(--paper)}
.ieval{display:flex;flex-direction:column;height:38%;min-height:90px}

/* Debugger */
.dhead{padding:5px 8px;background:var(--ink);color:var(--paper);font:13px var(--mono)}
.dhead .mut{color:#bbb}
.dsplit{display:grid;grid-template-columns:34% 1fr;height:44%;min-height:120px;border-bottom:1px solid var(--line)}
.dsplit .list{border-right:1px solid var(--line)}
.dcode{display:flex;flex-direction:column;min-height:0}
.dvars{display:grid;grid-template-columns:22% 30% 1fr;flex:1;min-height:100px}
.dvars>*{border-right:1px solid var(--line)}
.deval{display:flex;flex-direction:column;min-height:0;border-right:0!important}

/* Methodenlisten, Tests, Änderungen */
.mlsplit,.tsplit{display:grid;grid-template-columns:40% 1fr;flex:1;min-height:0}
.tsplit{grid-template-columns:32% 1fr}
.mlsplit>.list,.tsplit>.list:first-child{border-right:1px solid var(--line)}
.mlright{display:flex;flex-direction:column;min-height:0}
.tbar{padding:6px 10px;font:600 13px var(--sans);border-bottom:1px solid var(--line);background:var(--paper2)}
.tbar.green{background:#2e7d32;color:#fff}.tbar.yellow{background:#f2c037}.tbar.red{background:#c62828;color:#fff}
.note{margin:0;padding:6px 10px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line)}
.transcript{margin:0;flex:1;overflow:auto;padding:6px 10px;font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.hier{overflow:auto;flex:1;font:12px/1.7 var(--mono);padding:4px 0}
.hier .me{background:var(--pc)}
.hier a{color:var(--ink);text-decoration:none}.hier a:hover{text-decoration:underline}

/* Lehrgang */
.lsplit{display:grid;grid-template-columns:200px 1fr;flex:1;min-height:0}
.lsplit>.list{border-right:1px solid var(--line);font-family:var(--sans);font-size:13px;line-height:1.9}
.lpane{overflow:auto;padding:4px 14px 14px}
.lpane h3{font:700 15px var(--mono);margin:10px 0 4px}
.lpane p{margin:4px 0 10px;font-size:13.5px}
.ex{border:1px solid var(--line);margin:0 0 8px;background:var(--paper)}
.lcode{margin:0;padding:6px 8px;font:12.5px/1.5 var(--mono);white-space:pre-wrap;background:var(--paper2);border-bottom:1px solid #ccc}
.lcode i{font-style:normal}
.exb{display:flex;gap:4px;padding:4px}
.lout{margin:0;padding:0 8px 6px;font:12.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--accent)}
.lout:empty{display:none}
.lout.err{color:var(--err)}
.lnav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.about{padding:6px 16px 14px;overflow:auto;font-size:13.5px}
.about h3{font:700 16px var(--mono);margin:8px 0}

/* World-Menü */
.world{position:absolute;z-index:99999;background:var(--paper);border:1.5px solid var(--line);box-shadow:3px 3px 0 rgba(0,0,0,.5);min-width:180px;display:flex;flex-direction:column}
.wmh{font:700 11px var(--mono);padding:3px 8px;background:var(--ink);color:var(--paper)}
.wmi{font:13px var(--sans);text-align:left;border:0;background:none;padding:4px 10px;cursor:pointer;color:var(--ink)}
.wmi:hover{background:var(--ink);color:var(--paper)}

footer{font-size:11px;padding:3px 10px;background:var(--paper);border-top:1px solid var(--line);color:var(--mut);display:flex;gap:10px;flex-wrap:wrap}

/* schmale Bildschirme: Fenster untereinander */
@media (max-width:820px){
  body{overflow:auto;height:auto;min-height:100%}
  #desk{overflow:visible;display:flex;flex-direction:column;gap:12px;padding:10px 8px 20px}
  .win{position:relative!important;left:auto!important;top:auto!important;width:100%!important;height:auto!important;min-height:0;resize:none;z-index:auto!important}
  .win .wbody{flex:none;height:70vh}
  .win.w-workspace .wbody,.win.w-inspector .wbody{height:60vh}
  .win.w-transcript .wbody{height:30vh}
  .win.w-about .wbody,.win.w-hier .wbody{height:auto;max-height:80vh}
  .wbar{cursor:default}
  .bpanes{grid-template-columns:1fr 1fr;height:auto}
  .bpanes>*{height:120px;border-bottom:1px solid var(--line)}
  .win.w-browser .wbody{height:auto}.win.w-browser .code{height:50vh;flex:none}
  .win.w-debugger .wbody{height:auto}
  .dsplit,.dvars{grid-template-columns:1fr;height:auto}
  .dsplit>*,.dvars>*{height:30vh;border-right:0;border-bottom:1px solid var(--line)}
  .lsplit{grid-template-columns:1fr;grid-template-rows:140px 1fr}
  .lsplit>.list{border-right:0;border-bottom:1px solid var(--line)}
  .mlsplit,.tsplit,.isplit{grid-template-columns:1fr;grid-template-rows:35% 1fr}
  header .home{margin-left:0}
  header h1{white-space:normal;font-size:15px}
  header h1 span{display:block;font-size:12px;margin-top:2px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <h1>Smalltalk-Werkbank <span>· Smalltalk-80 im Browser</span></h1>
  <span id="status" role="status"></span>
  <a class="home" href="https://itzwieseltal.wordpress.com/" target="_blank" rel="noopener">itzwieseltal.wordpress.com</a>
</header>
<nav id="menu" aria-label="Werkzeuge"></nav>
<main id="desk"></main>
<footer>
  <span>Strg+D Do it · Strg+P Print it · Strg+I Inspect it · Strg+E Debug it · Strg+S Speichern · Esc Stopp · Rechtsklick: World-Menü</span>
  <span>Reihe »Alte Programmiersprachen« – <a href="https://itzwieseltal.wordpress.com/" target="_blank" rel="noopener">IT-Stammtisch Zwieseltal</a></span>
</footer>
<script type="text/plain" id="boot">!Object methodsFor: 'Vergleichen'!
== anObject
	"Identität: ist anObject dasselbe Objekt wie ich?"
	<primitive: 'identical'>
!
= anObject
	"Gleichheit. Unterklassen überschreiben das, Object vergleicht nur die Identität."
	^self == anObject
!
~= anObject
	^(self = anObject) not
!
~~ anObject
	^(self == anObject) not
!
hash
	<primitive: 'hash'>
!
identityHash
	<primitive: 'identityHash'>
! !

!Object methodsFor: 'Klasse'!
class
	<primitive: 'class'>
!
isKindOf: aClass
	<primitive: 'isKindOf'>
!
isMemberOf: aClass
	^self class == aClass
!
respondsTo: aSymbol
	<primitive: 'respondsTo'>
! !

!Object methodsFor: 'Initialisieren'!
initialize
	"Wird von new aufgerufen. Unterklassen setzen hier ihre Anfangswerte."
! !

!Object methodsFor: 'Ausgabe'!
printOn: aStream
	"Standard: 'a Konto' bzw. 'an Object'"
	aStream nextPutAll: self class article; space; nextPutAll: self class name
!
printString
	| stream |
	stream := WriteStream on: String new.
	self printOn: stream.
	^stream contents
!
displayString
	^self printString
!
asString
	^self printString
!
printNl
	Transcript show: self printString; cr
!
displayNl
	Transcript show: self displayString; cr
! !

!Object methodsFor: 'Kopieren'!
copy
	^self shallowCopy postCopy
!
shallowCopy
	<primitive: 'shallowCopy'>
!
postCopy
	^self
! !

!Object methodsFor: 'Fehler'!
error: aString
	^Error new signal: aString
!
doesNotUnderstand: aMessage
	<primitive: 'dnu'>
!
halt
	"Hält an und öffnet den Debugger"
	<primitive: 'halt'>
!
halt: aString
	<primitive: 'halt'>
!
subclassResponsibility
	^self error: 'Diese Methode muss eine Unterklasse implementieren'
!
shouldBeImplemented
	^self error: 'Diese Methode muss noch geschrieben werden'
!
shouldNotImplement
	^self error: 'Diese Nachricht ist hier nicht vorgesehen'
!
assert: aBlockOrBoolean
	aBlockOrBoolean value ifFalse: [^AssertionFailure new signal: 'Zusicherung verletzt']
!
assert: aBlockOrBoolean description: aString
	aBlockOrBoolean value ifFalse: [^AssertionFailure new signal: aString]
!
deny: aBlockOrBoolean
	aBlockOrBoolean value ifTrue: [^AssertionFailure new signal: 'Verneinung verletzt']
!
assert: actual equals: expected
	actual = expected ifFalse: [^AssertionFailure new signal: 'Erwartet: ', expected printString, ' – tatsächlich: ', actual printString]
! !

!Object methodsFor: 'Reflexion'!
perform: aSymbol
	<primitive: 'perform'>
!
perform: aSymbol with: a
	<primitive: 'perform'>
!
perform: aSymbol with: a with: b
	<primitive: 'perform'>
!
perform: aSymbol with: a with: b with: c
	<primitive: 'perform'>
!
perform: aSymbol withArguments: anArray
	<primitive: 'performWith'>
!
instVarAt: index
	<primitive: 'instVarAt'>
!
instVarAt: index put: anObject
	<primitive: 'instVarAtPut'>
!
instVarNamed: aString
	<primitive: 'instVarNamed'>
!
instVarNamed: aString put: anObject
	<primitive: 'instVarNamedPut'>
!
inspect
	"Öffnet einen Inspector auf mich"
	<primitive: 'inspect'>
!
browse
	self class browse
!
yourself
	^self
!
value
	^self
! !

!Object methodsFor: 'Testen'!
isNil
	^false
!
notNil
	^true
!
ifNil: aBlock
	^self
!
ifNotNil: aBlock
	^aBlock cull: self
!
ifNil: nilBlock ifNotNil: notNilBlock
	^notNilBlock cull: self
!
ifNotNil: notNilBlock ifNil: nilBlock
	^notNilBlock cull: self
!
isEmptyOrNil
	^false
!
isString
	^false
!
isSymbol
	^false
!
isNumber
	^false
!
isInteger
	^false
!
isFloat
	^false
!
isFraction
	^false
!
isCharacter
	^false
!
isArray
	^false
!
isCollection
	^false
!
isBlock
	^false
!
isClass
	^false
!
isBoolean
	^false
!
isLiteral
	^false
! !

!Object methodsFor: 'Sonstiges'!
-> anObject
	^Association key: self value: anObject
!
inform: aString
	Transcript show: aString; cr
! !

!UndefinedObject methodsFor: 'Testen'!
isNil
	^true
!
notNil
	^false
!
ifNil: aBlock
	^aBlock value
!
ifNotNil: aBlock
	^nil
!
ifNil: nilBlock ifNotNil: notNilBlock
	^nilBlock value
!
ifNotNil: notNilBlock ifNil: nilBlock
	^nilBlock value
!
isEmptyOrNil
	^true
!
isLiteral
	^true
! !

!UndefinedObject methodsFor: 'Ausgabe'!
printOn: aStream
	aStream nextPutAll: 'nil'
! !

!Boolean methodsFor: 'Testen'!
isBoolean
	^true
!
isLiteral
	^true
! !

!True methodsFor: 'Steuerung'!
ifTrue: trueBlock ifFalse: falseBlock
	"Der Compiler setzt diese Nachricht direkt als Sprung um, wenn beide Argumente Blöcke sind."
	^trueBlock value
!
ifFalse: falseBlock ifTrue: trueBlock
	^trueBlock value
!
ifTrue: trueBlock
	^trueBlock value
!
ifFalse: falseBlock
	^nil
!
and: aBlock
	^aBlock value
!
or: aBlock
	^true
!
& aBoolean
	^aBoolean
!
| aBoolean
	^true
!
not
	^false
!
xor: aBoolean
	^aBoolean not
! !

!True methodsFor: 'Ausgabe'!
printOn: aStream
	aStream nextPutAll: 'true'
! !

!False methodsFor: 'Steuerung'!
ifTrue: trueBlock ifFalse: falseBlock
	^falseBlock value
!
ifFalse: falseBlock ifTrue: trueBlock
	^falseBlock value
!
ifTrue: trueBlock
	^nil
!
ifFalse: falseBlock
	^falseBlock value
!
and: aBlock
	^false
!
or: aBlock
	^aBlock value
!
& aBoolean
	^false
!
| aBoolean
	^aBoolean
!
not
	^true
!
xor: aBoolean
	^aBoolean
! !

!False methodsFor: 'Ausgabe'!
printOn: aStream
	aStream nextPutAll: 'false'
! !

!Magnitude methodsFor: 'Vergleichen'!
< aMagnitude
	^self subclassResponsibility
!
> aMagnitude
	^aMagnitude < self
!
<= aMagnitude
	^(aMagnitude < self) not
!
>= aMagnitude
	^(self < aMagnitude) not
!
between: min and: max
	^self >= min and: [self <= max]
!
max: aMagnitude
	^self > aMagnitude ifTrue: [self] ifFalse: [aMagnitude]
!
min: aMagnitude
	^self < aMagnitude ifTrue: [self] ifFalse: [aMagnitude]
! !

!Number methodsFor: 'Arithmetik'!
+ aNumber
	<primitive: 'add'>
!
- aNumber
	<primitive: 'sub'>
!
* aNumber
	<primitive: 'mul'>
!
/ aNumber
	"Ganzzahlen ergeben exakte Brüche: 1/3 ist ein Fraction"
	<primitive: 'div'>
!
// aNumber
	"Ganzzahlige Division, abgerundet Richtung minus unendlich"
	<primitive: 'idiv'>
!
\\ aNumber
	"Rest passend zu //"
	<primitive: 'mod'>
!
rem: aNumber
	<primitive: 'rem'>
!
quo: aNumber
	<primitive: 'quo'>
!
abs
	<primitive: 'abs'>
!
negated
	<primitive: 'negated'>
!
squared
	^self * self
!
sqrt
	<primitive: 'sqrt'>
!
raisedTo: aNumber
	<primitive: 'raisedTo'>
!
** aNumber
	^self raisedTo: aNumber
!
reciprocal
	^1 / self
!
sign
	self > 0 ifTrue: [^1].
	self < 0 ifTrue: [^-1].
	^0
! !

!Number methodsFor: 'Vergleichen'!
< aNumber
	<primitive: 'lt'>
!
> aNumber
	<primitive: 'gt'>
!
<= aNumber
	<primitive: 'le'>
!
>= aNumber
	<primitive: 'ge'>
!
= aNumber
	<primitive: 'numEq'>
!
~= aNumber
	^(self = aNumber) not
!
hash
	<primitive: 'hash'>
! !

!Number methodsFor: 'Testen'!
isNumber
	^true
!
isLiteral
	^true
!
isZero
	^self = 0
!
even
	^self \\ 2 = 0
!
odd
	^self even not
!
positive
	^self >= 0
!
negative
	^self < 0
!
strictlyPositive
	^self > 0
!
isNaN
	<primitive: 'isNaN'>
!
isInfinite

do: aBlock

	self do: [:each | | v |

	^best

const EMPTYCLS = new STClass('(leer)', null, []);

/* ---------- Prozesse: Ausführen mit Unterbrechung, Debugger ---------- */
let runningProc = null;
const procs = new Set();
class Proc {

    this.done = false; this.susp = null; this.dbg = null;

  }
  resume(val, how, cont) {
    if (this.done) return;
    if (runningProc && runningProc !== this) { setTimeout(() => this.resume(val, how, cont), 20); return; }
    runningProc = this; this.susp = null; if (!cont) G.interrupt = false; setRunning(true);
    const saved = { stack: G.stack, handlers: G.handlers };
    G.stack = this.stack; G.handlers = this.handlers;
    G.stepMode = this.stepMode; G.stepDepth = this.stepDepth; G.stepHome = this.stepHome;
    const t0 = performance.now();
    let r, fin = null;
    try {
      r = how === 'throw' ? this.gen.throw(val) : this.gen.next(val);
      while (!r.done && r.value === ST.SLICE) {
        if (G.interrupt) { r = { done: false, value: { type: 'debug', exc: null, reason: 'Unterbrochen (Esc)' } }; break; }
        if (performance.now() - t0 > 30) { fin = 'later'; break; }
        r = this.gen.next(null);
      }
    } catch (e) { fin = e; }
    G.stack = saved.stack; G.handlers = saved.handlers; G.stepMode = null;
    runningProc = null;
    if (fin === 'later') { setTimeout(() => this.resume(null, null, true), 0); return; }
    setRunning(procs.size > 0 && [...procs].some(p => !p.done && !p.susp && p !== this));
    if (fin) { this.finish(); this.jsError(fin); return; }
    if (r.done) { this.finish(); if (this.cb.done) this.cb.done(r.value); return; }
    this.susp = r.value; this.stepMode = null;
    openDebugger(this);
  }
  jsError(e) {
    let msg;
    if (e instanceof ST.STSyntaxError) msg = 'Syntaxfehler: ' + e.message;
    else if (e instanceof RangeError) msg = 'Stapelüberlauf im Interpreter (zu tiefe Rekursion)';
    else if (e instanceof ST.NLR) msg = 'Rückgabe (^) aus einem Block, dessen Methode schon beendet ist';
    else { msg = 'Interner Fehler: ' + (e && e.message || e); console.error(e); }
    G.ui.transcript('\n‹' + msg + '›\n');
    if (this.cb.error) this.cb.error(msg); else status(msg);
  }
  finish() { this.done = true; procs.delete(this); if (this.dbg) { this.dbg.win.close(); this.dbg = null; } }
  abandon() {
    if (this.done) return;
    const saved = { stack: G.stack, handlers: G.handlers };
    G.stack = this.stack; G.handlers = this.handlers;
    ST.closeGen(this.gen);

function evaluate(ed, mode, ctx) {
  ctx = ctx || {};

  if (!sel.text.trim()) { status('Nichts ausgewählt'); return; }
  let gen;

  try {
    const m = ST.compileDoIt(sel.text, { cls: ST.classOf(rcv), ws: ctx.ws, ext: ctx.ext });
    gen = () => ST.invoke(m, rcv, [], null, null, ctx.outer || null);
  } catch (e) {
    if (e instanceof ST.STSyntaxError) {
      const p = sel.s + Math.min(e.pos, sel.text.length);
      ed.setMark([p, Math.min(p + 1, ed.value.length) || p, 'err']);
      status('Syntaxfehler: ' + e.message);

      return;
    }

  const p = new Proc(gen, sel.text.slice(0, 40), {
    done: v => {

}

}

    add('Klassenvariablen', () => [...v.classVars.keys()].map(ST.str));
    for (const [k] of v.classVars) add(k, () => { const x = v.classVars.get(k); return x === undefined ? null : x; }, x => v.classVars.set(k, x));
    add('Methoden', () => [...v.methods.keys()].sort().map(ST.sym));
    add('Metaklasse', () => v.isMeta ? K.Metaclass : v.meta);
    for (const n of v.allIv()) add(n, () => { const x = v.iv[n]; return x === undefined ? null : x; }, x => { v.iv[n] = x; });

  }

    if (v.items) v.items.forEach((x, i) => add(String(i + 1), () => v.items[i], y => { v.items[i] = y; }));
    else if (v.map && ST.inherits(v.cls, K.Dictionary)) for (const e of v.map.values()) add(ST.jsPrint(e.k), () => e.v, y => { e.v = y; });
    else if (v.map && ST.inherits(v.cls, K.Bag)) for (const e of v.map.values()) add(ST.jsPrint(e.v) + ' ×' + e.n, () => e.v);
    else if (v.map) [...v.map.values()].forEach((x, i) => add('Element ' + (i + 1), () => x));
    else if (v.frame) {
      const f = v.frame;
      add('Empfänger', () => f.self); add('Methode', () => ST.str(ST.frameLabel(f)));
      add('Aufrufer', () => f.sender ? Object.assign(new ST.STObject(K.Context), { frame: f.sender }) : null);
      for (const tv of frameTemps(f)) add(tv.name, () => tv.get(), tv.set);
    } else if (v.m) { add('Quelltext', () => ST.str(v.m.src)); add('Klasse', () => v.m.cls); add('Protokoll', () => ST.str(v.m.protocol || '')); }
    else if (v.str !== undefined && v.buf !== undefined) { add('Inhalt', () => v.str ? ST.str(v.buf) : v.buf); add('Position', () => v.pos); }
    return F;
  }
  if (Array.isArray(v)) { v.forEach((x, i) => add(String(i + 1), () => v[i], y => { v[i] = y; })); return F; }
  if (v instanceof ST.STStr || v instanceof ST.STSym) { [...v.s].slice(0, 500).forEach((c, i) => add(String(i + 1), () => ST.chr(c.codePointAt(0)))); return F; }

    add('Anzahl Argumente', () => v.node.nparams);
    add('Empfänger (self)', () => v.outer.self);
    for (const tv of frameTemps(v.outer)) add(tv.name, () => tv.get(), tv.set);
    return F;
  }
  if (v instanceof ST.Frac) {

    add('Zähler', () => toI(v.n)); add('Nenner', () => toI(v.d)); add('als Float', () => new ST.Flt(Number(v.n) / Number(v.d)));

  }

    add('hex', () => ST.str((b < 0n ? '-16r' : '16r') + (b < 0n ? -b : b).toString(16).toUpperCase()));
    add('binär', () => ST.str((b < 0n ? '-2r' : '2r') + (b < 0n ? -b : b).toString(2)));
    add('Stellen', () => (b < 0n ? -b : b).toString().length);
    return F;
  }
  if (v instanceof ST.STChar) { add('Code', () => v.c); return F; }
  if (v instanceof ST.Flt) { add('Wert (JS)', () => ST.str(String(v.v))); return F; }

}

    },
    go(c, s) {
      if (!c) return;

/* ---------- Debugger ---------- */
function openDebugger(proc) {
  const s = proc.susp;
  let exc = s.exc || null;
  const title = s.type === 'step' ? 'Einzelschritt' : exc ? ST.excText(exc) : (s.reason || 'Halt');
  if (proc.dbg) { proc.dbg.update(title, exc); proc.dbg.win.front(); return; }
  const w = new Win('Debugger', { kind: 'debugger', w: 780, h: 540, dx: 40, dy: 30 });
  const head = h('div.dhead', { role: 'alert' });
  const stackL = list(null, it => selFrame(it && it.f), { label: 'Aufrufstapel', header: 'Aufrufstapel' });
  const ed = new Editor('');
  const varsL = list(null, it => { varVal.textContent = it ? ST.printSync(it.get(), 5000) : ''; }, { label: 'Variablen', header: 'Variablen', onDbl: it => openInspector(it.get()) });
  const varVal = h('pre.ival');
  const evalEd = new Editor('', { label: 'Ausdruck im Kontext des gewählten Rahmens' });
  let frame = null;
  const saveB = btn('Speichern', save, 'Methode ändern und den Rahmen neu starten (Strg+S)', 'b prim');
  ed.keys.s = save;
  ed.onDirty = d => saveB.classList.toggle('dirty', d);
  const createB = btn('Methode anlegen', createMethod, 'Die fehlende Methode anlegen und hineinspringen', 'b warn');
  const tools = h('div.tools', null,
    btn('Weiter', () => go(null), 'Fortsetzen (Proceed)'),
    btn('Hinein', () => go('into'), 'Einzelschritt in die nächste Nachricht hinein'),
    btn('Darüber', () => go('over'), 'Nächste Nachricht in diesem Rahmen ausführen'),
    btn('Durch', () => go('through'), 'Auch in Blöcke dieser Methode hineinspringen'),
    btn('Neustart', restart, 'Gewählten Rahmen von vorn beginnen'),
    btn('Abbrechen', () => proc.abandon(), 'Prozess beenden (Abandon)', 'b danger'),
    createB, saveB);
  const evalTools = evalButtons(evalEd, () => frame ? { rcv: frame.self, ext: extScopes(frame), outer: frame.cur || frame, after: () => selFrame(frame) } : {});
  w.body.append(head, tools,
    h('div.dsplit', null, stackL.el, h('div.dcode', null, ed.el)),
    h('div.dvars', null, varsL.el, varVal, h('div.deval', null, evalTools, evalEd.el)));
  function extScopes(f) {
    const r = []; for (let x = (f.cur || f); x; x = x.outer) r.push(x.scope);
    return r;
  }
  function update(t, e) {
    if (e !== undefined) exc = e;

    if (exc) head.append(h('span.mut', null, '  ' + exc.cls.name));
    createB.style.display = exc && exc._resend ? '' : 'none';
    const frames = proc.stack.slice().reverse();
    stackL.set(frames.map((f, i) => ({ label: ST.frameLabel(f), key: i, f, cls: f.method.isDoIt ? 'doit' : (f.method.cls.kernel ? 'kern' : '') })));
    let pick = 0;
    if (exc) { const k = frames.findIndex(f => !f.method.cls.kernel || f.method.isDoIt); if (k >= 0) pick = k; }
    if (frames.length) stackL.select(pick); else { ed.set(''); varsL.set([]); }
  }
  function selFrame(f) {
    frame = f; if (!f) return;

    ed.set(src, pc && pc.pos ? [pc.pos[0], pc.pos[1], 'pc'] : null);
    ed.ta.readOnly = !!m.isDoIt || !!f.isBlock && false;
    if (pc && pc.pos) ed.reveal(pc.pos[0]);
    saveB.disabled = !!m.isDoIt;
    const vs = [{ label: 'self', key: 'self', get: () => f.self }, { label: 'thisContext', key: 'ctx', get: () => Object.assign(new ST.STObject(K.Context), { frame: f }) }];
    for (const t of frameTemps(f)) vs.push({ label: t.name, key: 't:' + t.name, get: t.get });
    const sc = ST.classOf(f.self);
    if (f.self instanceof ST.STObject) for (const n of sc.allIv()) vs.push({ label: n, key: 'i:' + n, get: () => { const v = f.self.iv[n]; return v === undefined ? null : v; }, cls: 'iv' });
    if (exc && f === proc.stack[proc.stack.length - 1]) vs.push({ label: '‹Ausnahme›', key: 'exc', get: () => exc });

  function resumeWith(v, how) {

/* ---------- Test Runner ---------- */

    btn('Alle ausführen', () => run(testClasses())), btn('Auswahl ausführen', () => cl.selected && run([cl.selected.cls])),
    btn('Debuggen', () => { const it = res.selected; if (it) debugTest(it.cls, it.sel); else status('Erst ein Ergebnis wählen'); }, 'Gewählten Test ohne Fehlerfang ausführen'),
    btn('Aktualisieren', fill)), bar, h('div.tsplit', null, cl.el, res.el));
  function testClasses() { return ST.allClasses().filter(c => !c.isMeta && c !== K.TestCase && ST.inherits(c, K.TestCase)); }
  function fill() { cl.set(testClasses().map(c => ({ label: c.name + ' (' + [...c.methods.keys()].filter(s => /^test/.test(s) && !s.includes(':')).length + ')', key: c.name, cls: c }))); }

    const out = []; let pass = 0, fail = 0, err = 0;

      for (const s of sels) {
        const r = ST.evalSync('(' + c.name + ' selector: #' + s + ') run', null, { maxSlices: 3000 });
        let st = 'error', msg = r.msg || '';

        if (st === 'pass') pass++; else if (st === 'failure') fail++; else err++;
        out.push({ label: (st === 'pass' ? '✓ ' : st === 'failure' ? '✗ ' : '! ') + c.name + '>>' + s + (msg ? ' – ' + msg : ''), key: c.name + s, cls: c, sel: s, st, clsName: st });
      }
    }
    res.set(out.map(o => Object.assign(o, { cls: o.cls })).map(o => ({ label: o.label, key: o.key, cls: o.cls, sel: o.sel, title: o.st })));
    [...res.el.querySelectorAll('.li')].forEach((row, i) => row.classList.add('r-' + out[i].st));
    const total = pass + fail + err;
    bar.className = 'tbar ' + (err ? 'red' : fail ? 'yellow' : total ? 'green' : '');

    const src = '| t |\nt := ' + c.name + ' selector: #' + s + '.\nt setUp.\n[t perform: #' + s + '] ensure: [t tearDown].\n#bestanden';
    const p = new Proc(ST.doItGen(src, null), 'Test', { done: v => { status(c.name + '>>' + s + ' bestanden'); run(testClasses()); } });
    p.resume(null);
  }

  w.scrollIntoView();

}

function openLessons(opts) {
  const w = new Win('Lehrgang', Object.assign({ kind: 'lessons', w: 620, h: 520 }, opts));
  const ws = new Map();
  const nav = list(LESSONS.map((l, i) => ({ label: (i + 1) + '. ' + l.t, key: i })), it => it && show(it.key), { label: 'Lektionen' });
  const pane = h('div.lpane');
  w.body.append(h('div.lsplit', null, nav.el, pane));
  function show(i) {
    const L = LESSONS[i];
    pane.innerHTML = '';
    pane.append(h('h3', null, (i + 1) + '. ' + L.t), h('p', { html: L.d }));
    if (i >= 6) pane.append(h('p.mut', null, 'Ab hier braucht es das Bank-Beispiel: ', btn('Bank-Beispiel laden', loadBank, null, 'bs')));
    for (const src of L.ex) {
      const out = h('pre.lout', { 'aria-live': 'polite' });
      const card = h('div.ex', null,
        h('pre.lcode', { html: highlight(src) }),
        h('div.exb', null,
          btn('Ausführen', () => runEx(src, out), 'Wie Print it'),
          btn('→ Workspace', () => { const ww = openWorkspace(src + '\n'); ww.ed.ta.setSelectionRange(0, src.length); }, 'In einem Workspace öffnen', 'bs')),
        out);
      pane.append(card);
    }
    pane.append(h('div.lnav', null,
      i > 0 ? btn('◂ ' + LESSONS[i - 1].t, () => nav.select(i - 1)) : '',
      i < LESSONS.length - 1 ? btn(LESSONS[i + 1].t + ' ▸', () => nav.select(i + 1)) : ''));
    pane.scrollTop = 0;
  }
  function runEx(src, out) {
    out.textContent = '…'; out.className = 'lout';
    let gen;
    try { const m = ST.compileDoIt(src, { ws }); gen = () => ST.invoke(m, null, [], null, null, null); }
    catch (e) { out.textContent = 'Syntaxfehler: ' + e.message; out.className = 'lout err'; return; }
    const p = new Proc(gen, 'Lektion', {
      done: v => { out.textContent = '→ ' + ST.printSync(v, 3000); },
      abandoned: () => { out.textContent = 'abgebrochen'; out.className = 'lout err'; },
      error: m => { out.textContent = m; out.className = 'lout err'; }
    });
    p.resume(null);
  }
  nav.select(0);
  w.scrollIntoView();
  return w;
}

/* ---------- Über ---------- */
function openAbout() {
  const w = new Win('Über die Werkbank', { kind: 'about', w: 560, h: 470 });
  w.body.append(h('div.about', { html: `
<h3>Smalltalk-Werkbank</h3>
<p>Ein Smalltalk-80 im Browser, geschrieben in JavaScript – als Begleitseite zum Artikel über Smalltalk-80 auf
<a href="https://itzwieseltal.wordpress.com/" target="_blank" rel="noopener">itzwieseltal.wordpress.com</a>.</p>
<p><b>Was drin ist:</b> ein Smalltalk-Compiler (Syntax nach dem Blue Book, dazu die Pharo-Ergänzungen <code>{ }</code> und <code>:=</code>), ein Interpreter mit echten Nachrichten,
Metaklassen, Blöcken mit nicht-lokaler Rückgabe, beliebig großen Ganzzahlen und exakten Brüchen, Ausnahmen mit <code>on:do:</code>, <code>retry</code>, <code>resume:</code> und <code>ensure:</code>,
dazu die klassischen Werkzeuge Workspace, Transcript, System Browser, Inspector, Debugger (mit Ändern und Weitermachen), SUnit-Test-Runner und eine Änderungsliste mit File In/File Out.</p>
<p>Etwa <b>650 Methoden der Kernbibliothek</b> sind selbst in Smalltalk geschrieben und im Browser lesbar und änderbar – <code>True&gt;&gt;ifTrue:ifFalse:</code> genauso wie <code>Collection&gt;&gt;inject:into:</code>.
Was nur ein Primitiv ist, steht als <code>&lt;primitive: …&gt;</code> im Quelltext.</p>
<p><b>Unterschiede zu einem echten Smalltalk-80:</b> Es gibt keine Bytecode-VM, sondern einen Baum-Interpreter; <code>ifTrue:</code>, <code>whileTrue:</code> und <code>to:do:</code> werden wie beim echten Compiler direkt übersetzt.
Die grafische Oberfläche ist in HTML gebaut, nicht in Smalltalk (kein MVC, kein BitBlt). <code>new</code> ruft wie in Pharo <code>initialize</code> auf – das lässt sich unten abschalten.
Ein Image im eigentlichen Sinn gibt es nicht: »Image sichern« schreibt alle Änderungen als File-In-Datei.</p>
<p><label><input type="checkbox" id="newinit" checked> <code>new</code> ruft <code>initialize</code> auf (Pharo); aus = Smalltalk-80-Verhalten</label></p>
<p><b>Tastatur:</b> Strg+D Do it · Strg+P Print it · Strg+I Inspect it · Strg+E Debug it · Strg+S Speichern · Esc unterbricht.</p>
<p>Weitere Teile der Reihe über alte Programmiersprachen:
<a href="https://sky4walk.github.io/itzwieseltal/SmallHtml/simula.html" target="_blank" rel="noopener">Simula-Werkbank</a> ·
<a href="https://sky4walk.github.io/itzwieseltal/SmallHtml/lisp.html" target="_blank" rel="noopener">Lisp-Werkbank</a> ·
<a href="https://sky4walk.github.io/itzwieseltal/SmallHtml/prolog.html" target="_blank" rel="noopener">Prolog-Werkbank</a></p>
<p class="mut">${esc(ST.G.globals.size)} globale Namen · ${ST.allClasses().length} Klassen</p>` }));
  const cb = w.body.querySelector('#newinit'); cb.checked = G.newInit; cb.onchange = () => { G.newInit = cb.checked; G.epoch++; };
}

/* ---------- Menü ---------- */
const MENU = [
  ['Workspace', () => openWorkspace('')], ['Transcript', () => openTranscript()], ['Browser', () => openBrowser()],
  ['Lehrgang', () => openLessons()], ['Test Runner', () => openTestRunner()], ['Änderungen', openChanges],
  ['Bank-Beispiel laden', loadBank], ['File In …', fileInDialog], ['Image sichern', saveImage],
  ['Smalltalk inspizieren', () => openInspector(G.globals.get('Smalltalk'))], ['Über', openAbout]
];
function buildMenu() {
  const m = document.getElementById('menu');
  for (const [label, fn] of MENU) m.append(btn(label, fn, null, 'mb'));
  m.append(h('span.wfill'), btn('■ Stopp', interrupt, 'Laufendes Programm unterbrechen (Esc)', 'mb stop'));
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') interrupt(); });
desk.addEventListener('contextmenu', e => {
  if (e.target !== desk) return;
  e.preventDefault();
  const old = document.querySelector('.world'); if (old) old.remove();
  const wm = h('div.world', { role: 'menu', style: 'left:' + (e.clientX) + 'px;top:' + (e.clientY - desk.getBoundingClientRect().top + desk.scrollTop) + 'px' },
    h('div.wmh', null, 'World'), ...MENU.map(([l, f]) => h('button.wmi', { type: 'button', onclick: () => { wm.remove(); f(); } }, l)));
  desk.append(wm);
  setTimeout(() => addEventListener('pointerdown', function cl(ev) { if (!wm.contains(ev.target)) { wm.remove(); removeEventListener('pointerdown', cl); } }), 0);
});
G.ui.download = download;

/* ---------- Start ---------- */
buildMenu();
G.ui.transcript('Smalltalk-Werkbank bereit · ' + ST.allClasses().length + ' Klassen\n' +
  'Rechtsklick auf den Hintergrund öffnet das World-Menü.\n');
if (narrow()) {
  openLessons(); openWorkspace(WELCOME); openTranscript();
} else {
  const W = desk.clientWidth;
  openLessons({ x: Math.max(10, W - 640), y: 12, w: Math.min(620, W - 20), h: Math.min(560, desk.clientHeight - 30) });
  openTranscript({ x: 12, y: Math.max(12, desk.clientHeight - 250), w: 470, h: 230 });
  openWorkspace(WELCOME, { x: 12, y: 12, w: Math.min(560, W - 680 > 380 ? W - 680 : 560), h: Math.max(300, desk.clientHeight - 290) });
}
starting = false;
if (narrow()) window.scrollTo(0, 0);
})();
